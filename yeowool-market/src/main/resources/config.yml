# YeowoolMarket 설정

# NPC 상점 (기획서 7.1 - "관리진이 지정한 물품만 구매/판매").
# "Spectra ShopGUI+" ItemsAdder 애드온(namespace: spectra_shopgui_plus)의
# GUI를 그대로 사용함 - 그 애드온의 contents/spectra_shopgui_plus 폴더를 서버
# ItemsAdder에 넣고 /iazip 해야 실제 배경 이미지가 보임. 없으면 자동으로
# 평범한 제목 + 바닐라 아이템으로 대체됨.
#
# gui-background-offset: 배경 이미지가 왼쪽/오른쪽으로 살짝 어긋나 보이면 이
# 값을 조절하세요. 음수가 클수록(예: -52) 이미지가 더 왼쪽으로, 0에 가까울수록
# 더 오른쪽으로 이동합니다. 아이템 아이콘 위치는 항상 고정이라 이 값은 배경
# 이미지 위치에만 영향을 줍니다.
#
# 클릭 방식이 예전과 다름:
# 좌클릭 = 구매 수량 선택 GUI, 우클릭 = 판매 수량 선택 GUI, Shift+우클릭/휠클릭
# = 보유한 만큼 즉시 전량 판매.
#
# default-open: /상점 을 인자 없이 입력했을 때 무엇을 열지 정합니다.
#   "menu" (기본값) = 전체 상점 목록(메인 메뉴)을 먼저 보여줌
#   상점 ID (예: "farm") = 메인 메뉴 없이 그 상점으로 바로 들어감
# /상점 <ID> 는 이 설정과 무관하게 항상 그 상점으로 바로 들어갑니다.
#
# 상점을 원하는 만큼 만들 수 있습니다. /상점수정으로 config.yml에 정의된 상점도
# 인게임에서 직접 수정할 수 있습니다 (처음 수정하는 순간부터는 그 상점의 내용이
# DB에 저장되어 여기 config.yml 값보다 우선하게 됩니다 - config.yml 파일 자체는
# 바뀌지 않음). 각 상점마다:
#   - size: GUI 크기 (9~54, 9의 배수로 자동 보정됨). 54면 슬롯 4/45/53이
#     자동으로 메인메뉴/이전페이지/다음페이지 버튼으로 예약되므로 그 자리에는
#     아이템을 배치하지 마세요 (54 미만 크기는 45/53이 아예 없어 페이지 넘김이
#     비활성화됨). ItemsAdder 배경 이미지는 항상 54칸 기준으로 그려져 있어서
#     54보다 작게 하면 이미지가 상점 칸 아래로 넘쳐 보입니다 - ItemsAdder를
#     안 쓰거나 이미지 없이 평범한 제목만 쓸 상점만 더 작게 만드세요.
#   - mode: BUY_ONLY(구매만) / SELL_ONLY(판매만) / BOTH(둘 다)
#   - decoration: 빈 슬롯을 채울 장식 아이템 ("도트" 텍스처 리소스팩용 custom-model-data 지정 가능).
#     실제 아이템으로 슬롯을 채우는 방식이라 ItemsAdder 배경 이미지를 가려버리니,
#     이미지 배경을 쓰는 상점에서는 생략하세요 (빈 슬롯은 그대로 두면 배경이 비쳐 보임).
#   - items: slot을 생략하면 앞에서부터 자동 배치됨
#            buy-price 생략/0 = 구매 불가, sell-price 생략/0 = 판매 불가
#            material 대신 item-id를 쓰면 ItemsAdder 커스텀 아이템 (예: "yeowool:golden_wheat")
#            material을 쓸 때만 custom-model-data로 리소스팩 텍스처 아이콘 지정 가능
#            page: 생략 시 1 (1부터 시작) - 한 상점을 여러 페이지로 나눌 때 사용
#
# 상점 예시 (참고용 - shops: 밑에 이런 식으로 직접 추가하면 됩니다):
#   farm:
#     title: "농산물 상점"
#     size: 54
#     mode: BOTH
#     items:
#       - slot: 10
#         material: WHEAT
#         sell-price: 4
#       - slot: 11
#         material: CARROT
#         sell-price: 4
npc-shop:
  gui-background-offset: -46
  default-open: "menu"
  shops: {}

  # Citizens가 설치되어 있을 때만 사용됨: NPC ID -> 위에서 정의한 상점 ID.
  # (Citizens에서 /npc create 로 NPC를 만든 뒤 /npc id 로 ID를 확인하세요).
  citizens-npc-shops: {}

  # /상점이동 이 텔레포트할 상점가 좌표. world가 비어있으면 "위치 미설정"으로 취급됨.
  # 상점가에 서서 F3으로 좌표 확인한 뒤 아래에 그대로 입력하세요.
  location:
    world: ""
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0

  # 상점 NPC가 실제로 있는 서버 이름(velocity.toml [servers]의 이름과 일치해야 함).
  # /상점이동을 다른 서버에서 실행하면 이 서버로 먼저 보낸 뒤 도착하자마자 NPC 앞으로 이동시킴.
  npc-server-id: lobby

  # 지금 이 서버 자신의 이름(velocity.toml 기준) - 위 npc-server-id와 같으면 "내가 그 서버다"로 판단.
  this-server-id: lobby

# /경매 — 예전에는 즉시구매 전용 /거래소(플레이어 상점)와 입찰 전용 /경매가 따로 있었는데,
# /경매 하나로 통합했습니다(등록할 때 즉시구매가를 0으로 두면 순수 입찰 경매, 값을 넣으면
# 즉시구매도 가능한 경매가 됨). GUI/배경/아이콘은 "v0id AuctionHouse 2.0" 팩 기반입니다.
auction:
  # 낙찰/즉시구매 완료 시 소각되는 수수료
  fee-percent: 5
  # GUI 배경(yeowool_auction:auctionhouse_bg 등)의 좌우 위치 보정값 — 인게임에서 보면서 조정하세요.
  gui-background-offset: -8
  # 입찰 화면(bidding.png)의 +/- 버튼 3개가 얼마씩 조정하는지 (온 기준)
  bid-increments: [1000, 10000, 100000]

# 의뢰 게시판 — 플레이어가 "아이템 N개 구함, 개당 P온" 의뢰를 올리고 다른 플레이어가 나눠서 납품.
# 게시판은 아래 ItemsAdder 가구를 우클릭해야만 열리고, /의뢰는 어디서나 "내 의뢰"만 엽니다.
quest-board:
  # 게시판으로 쓸 ItemsAdder 가구 ID (W6 Quest Board 팩)
  furniture-id: "workshop_six:quest_board"
  # 등록할 때 총 보상에 더해 추가로 내는 수수료(%) — 환불되지 않고 소각
  fee-percent: 5
  # 의뢰 유지 시간(시간). 지나면 남은 보상이 의뢰자에게 자동 환불
  duration-hours: 72
  # 한 사람이 동시에 올릴 수 있는 진행 중 의뢰 수
  max-open-per-player: 5
  # 의뢰 하나의 최대 수량
  max-quantity: 100000
  # 납품 보상 이 금액(온)당 별조각 1개, 한 사람당 하루 최대 stardust-daily-cap개 (0이면 끔)
  stardust-per-reward: 10000
  stardust-daily-cap: 10

# 떠돌이 상인 — 등록한 후보 지점(세 서버 어디든) 중 한 곳에 가끔 나타나 정해진 시간 동안 상점을 엽니다.
# 세 서버에 한 명만 존재하며, 세 서버 설정을 똑같이 맞춰주세요. 서버 식별은 위 npc-shop.this-server-id를 씁니다.
wandering-merchant:
  enabled: true
  # 우클릭하면 열리는 상점 ID — /상점생성으로 만든 상점 또는 위 npc-shop 상점 (로테이션 설정 추천)
  shop-id: "wandering_merchant"
  # NPC 이름 (Citizens 색상 코드 & 사용)
  npc-name: "&6떠돌이 상인"
  entity-type: WANDERING_TRADER
  # 한 번 나타나면 머무는 시간(분)
  stay-minutes: 30
  # 떠난 뒤 다음 등장까지 대기 시간(분) — 이 범위에서 무작위
  interval-min-minutes: 180
  interval-max-minutes: 300
  # 공지에 쓸 서버 표시 이름 (velocity.toml 서버 이름 → 표시 이름)
  server-names:
    lobby: "로비"
    town: "마을"
    wild: "야생"

# 카지노 — 카지노 장식 가구(ItemsAdder, iavegastables:<이름>_decor)를 우클릭하면 미니게임이 열립니다.
# 게임은 칩으로만 하고, 칩은 온으로만 사고 온으로만 되팝니다 (캐시로는 절대 못 삽니다).
# 칩은 DB 잔액이라 세 서버 공통입니다. 세 서버 설정을 똑같이 맞춰주세요. 바꾼 뒤 /카지노관리 리로드.
casino:
  # 칩 1개 가격(온). 되팔 때도 같은 값
  chip-price: 1000
  # 한 사람이 하루(서버 시간 자정 기준, 세 서버 합산)에 살 수 있는 칩 수. 판매는 한도 없음
  daily-buy-limit: 500
  # 한 판 최대 베팅(칩)
  max-bet: 100
  # true: /카지노로 어디서나 환전, false: 환전 NPC(/카지노관리 npc로 연결)에서만
  exchange-anywhere: true
  # 큰 당첨 세 서버 공지: 배당 min-multiplier배 이상 또는 당첨 칩 min-chips개 이상
  announce:
    min-multiplier: 20
    min-chips: 1000
  games:
    # 배당은 "돌려받는 총 칩" 배수입니다 (×2 = 건 칩 포함 2배).
    slot:
      enabled: true
      furniture-id: "iavegastables:classic_decor"
      # 첫 번째 그림이 딱 2개 나왔을 때 배당
      two-cherries: 2
      # 그림 목록 — 첫 번째 그림이 "체리" 역할(2개 배당). weight가 클수록 자주 나옵니다. item은 창에 보일 아이템.
      # 기본값 환수율 약 95% (그림 3개가 같으면 payout 배당). 바꾸면 환수율도 바뀌니 주의.
      symbols:
        - {name: "체리", item: SWEET_BERRIES, weight: 11, payout: 5}
        - {name: "사과", item: APPLE, weight: 8, payout: 10}
        - {name: "멜론", item: MELON_SLICE, weight: 6, payout: 15}
        - {name: "종", item: BELL, weight: 3, payout: 20}
        - {name: "금괴", item: GOLD_INGOT, weight: 2, payout: 30}
        - {name: "다이아", item: DIAMOND, weight: 1, payout: 40}
        - {name: "럭키 7", item: NETHER_STAR, weight: 1, payout: 50}
    roulette:
      enabled: true
      furniture-id: "iavegastables:roulette_decor"
      # 유럽식 0~36. 숫자 하나 / 빨강·검정·홀·짝·1~18·19~36 / 1·2·3구간. 0이 나오면 숫자 0 베팅 외에는 모두 짐
      number-payout: 36
      outside-payout: 2
      dozen-payout: 3
    dice:
      enabled: true
      furniture-id: "iavegastables:dice_decor"
      # 주사위 2개 합: 로우(2~6)·하이(8~12), 7. 7이 나오면 로우·하이 모두 짐
      high-low-payout: 2
      seven-payout: 4
    blackjack:
      enabled: true
      furniture-id: "iavegastables:blackjack_decor"
      # 처음 두 장이 21(블랙잭)일 때 배당. 일반 승리 ×2, 무승부 환급, 딜러는 17 이상에서 멈춤
      blackjack-payout: 2.5
