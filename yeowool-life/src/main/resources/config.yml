# YeowoolLife 설정
# 모든 xp/제한 값은 밸런스 튜닝용 플레이스홀더입니다.

farming:
  growth-minutes: 10
  xp-per-harvest: 5

# 자동줍기권/자동심기권 — /자동줍기권 지급 <횟수>, /자동심기권 지급 <횟수>(관리자 전용)로만 지급됩니다.
# 지급받은 아이템은 지정한 횟수만큼 충전된 채로 나오며, 우클릭 시 1회씩, 쉬프트+우클릭 시 한 번에 전부
# 사용됩니다. 밀/당근/감자/비트/네더 사마귀/코코아를 다 자란 상태로 수확할 때만 적용됩니다. 남은 횟수는
# 레벨 숫자로 표시됩니다(둘 다 활성화되어 있으면 자동줍기가 우선 표시됨) — 스코어보드에도
# <autopickup>/<autoplant> 토큰으로 뜹니다.

logging:
  xp-per-log: 2
  # 묘목이 나무로 자라기까지 걸리는 고정 시간 (바닐라 랜덤 성장 대신).
  # 단일 묘목도 자라도록 허용함 (정글/다크오크의 바닐라 2x2 요구사항 생략).
  sapling-growth-minutes: 15

ranch:
  xp-per-breed: 10
  max-animals-per-chunk: 16

fishing:
  xp-per-catch: 3
  # /도감의 물고기 도감(FishCatalogGui)에 fishing_expansion 팩의 "fish_codex" 배경
  # 이미지를 띄울 때 쓰는 가로 위치 보정값. 배경이 좌우로 어긋나 보이면 조절하세요.
  # 팩 제작자가 자신의 DeluxeMenus 설정(fish_codex.yml)에서 이 배경에 실제로 쓴 값이
  # -8이라, 그 값을 기본값으로 씀 (직업 배경의 -46과는 스케일이 다름 — 서로 다른 이미지).
  gui-background-offset: -8
  # 바닐라 낚시 대기시간(찌를 던진 뒤 입질이 오기까지) 대신 여기서 지정한 범위로 강제 적용.
  wait-time:
    min-seconds: 5
    max-seconds: 30
  # 입질(BITE)이 오면 보스바가 뜨고 total-duration-ms 동안 차오릅니다. 그 안에서
  # 무작위 위치에 "스위트 스팟"(sweet-spot-min/max-width-ms 폭)이 생기고, 그 구간에
  # 보스바가 들어가 있을 때(초록색) 우클릭해서 릴을 감으면 완벽한 타이밍(perfect-*),
  # 그 앞뒤로 good-buffer-ms만큼은 좋은 타이밍(good-*) — 각각 등급 확률(rare-bonus)과
  # 크기(size-bonus-percent, 최대 크기 쪽으로 그 %만큼 보정)에 곱/가산됨. 그보다 멀리
  # 벗어나서 감으면 miss-fail-chance-percent 확률로 아예 물고기를 놓칩니다.
  minigame:
    total-duration-ms: 2500
    sweet-spot-min-width-ms: 400
    sweet-spot-max-width-ms: 700
    good-buffer-ms: 300
    perfect-rare-bonus: 1.3
    good-rare-bonus: 1.1
    perfect-size-bonus-percent: 25
    good-size-bonus-percent: 10
    miss-fail-chance-percent: 40
  # "별" 등급 — 새로운 물고기 종류가 아니라, 정상적으로 낚은 아무 물고기에나 독립적으로
  # chance-percent 확률로 붙는 "반짝이는" 변종(원본 CustomFishing의 실버/골드 스타와
  # 같은 개념). 붙으면 등급 표시가 "별"로 바뀌고 크기가 size-bonus-percent%만큼 커짐.
  star:
    chance-percent: 2
    size-bonus-percent: 40
  # 매일 start-hour(서버 시간, 24시 기준)에 자동 시작해서 duration-minutes 동안 진행되는
  # 낚시 대회. 대회 중 낚은 물고기 중 가장 큰 걸 기준으로 참가자 순위를 매기고, 종료 시
  # 1~3위에게 rewards에 설정된 만큼 온을 지급합니다(0이거나 생략하면 보상 없음).
  competition:
    start-hour: 18
    duration-minutes: 60
    rewards:
      1: 50000
      2: 30000
      3: 15000
  # /도감으로 확인 가능. 등급마다 원하는 만큼 물고기를 추가할 수 있음.
  # custom-icon은 ItemsAdder "fishing_expansion" 팩의 아이템 id로, 잡은 적이 있는
  # 물고기의 /도감 아이콘에 우선 사용됨(없거나 ItemsAdder 미설치 시 material로 대체).
  # 등급별 가중치(weight)는 그대로 유지하고 fishing_expansion 팩의 물고기 60종으로 교체함.
  rarities:
    - name: 일반
      weight: 60
      color: white
      fish:
        - id: trout
          name: "송어"
          material: COD
          custom-icon: "fishing_expansion:trout"
