# 직업 시스템: 한 번에 하나의 직업만 활성화할 수 있습니다 (/직업 선택 - GUI로 선택).
# 전직해도 이전 직업의 레벨/경험치는 그대로 남아있고, 다시 선택하면 이어집니다.
# /직업 목록 은 각 직업의 설명/보유 레벨을 보여주는 정보용 GUI입니다.
# 레벨업마다 스킬 포인트를 얻고, /직업 스킬 GUI에서 아래 skills(모든 직업 공통, 4개)에
# 포인트를 배분해 패시브 보너스를 올릴 수 있습니다.
jobs:
  # /직업 스킬 화면에 medival_jobs 팩의 직업별 배경 이미지를 띄울 때 쓰는 가로 위치 보정값입니다.
  # 배경이 왼쪽/오른쪽으로 살짝 어긋나 보이면 이 값을 조금씩 조절해서 맞추세요.
  gui-background-offset: -46
  max-level: 50
  xp-curve:
    # 필요 경험치 = base * 레벨 ^ exponent
    base: 100
    exponent: 1.8
  # BONUS_CURRENCY_CHANCE_PERCENT 스킬이 발동할 때마다 지급되는 고정 온 금액
  bonus-currency-per-proc: 10
  xp-per-action:
    alchemist: 6      # 양조기에서 완성된 물약을 꺼낼 때마다
    blacksmith: 5     # 화로/용광로에서 광석을 제련해 주괴를 꺼낼 때마다
    builder: 3        # 나무 블록(판자/계단/슬래브/울타리/문) 설치 1회당
    digger: 8         # 구조물 상자를 처음 열어 전리품을 획득할 때마다
    enchanter: 6       # 마법부여 테이블에서 인챈트를 부여할 때마다
    farmer: 5         # 다 자란 작물 수확 1회당
    fisherman: 5      # 낚시 성공 1회당
    hunter: 4         # 적대적 몬스터 처치 1회당
    miner: 4          # 광석 채굴 1회당
    wood_cutter: 2    # 원목 채벌 1회당
  # icon은 ItemsAdder가 없거나 custom-icon을 못 찾을 때 쓰이는 대체 재질입니다.
  # custom-icon은 medival_jobs 팩의 아이템 id로, /직업 목록·/직업 선택 GUI에서 우선 사용됩니다.
  list:
    alchemist:
      display: "연금술사"
      icon: BREWING_STAND
      custom-icon: "medival_jobs:medival_jobs_alchemist"
      description: "양조기에서 물약을 완성하며 경험치를 얻습니다."
    blacksmith:
      display: "대장장이"
      icon: ANVIL
      custom-icon: "medival_jobs:medival_jobs_blacksmith"
      description: "화로/용광로에서 광석을 제련하며 경험치를 얻습니다."
    builder:
      display: "건축가"
      icon: BRICKS
      custom-icon: "medival_jobs:medival_jobs_builder"
      description: "나무 계열 블록을 설치하며 경험치를 얻습니다."
    digger:
      display: "도굴꾼"
      icon: CHEST
      custom-icon: "medival_jobs:medival_jobs_digger"
      description: "구조물 상자를 처음 열어 전리품을 획득하며 경험치를 얻습니다."
    enchanter:
      display: "인챈터"
      icon: ENCHANTING_TABLE
      custom-icon: "medival_jobs:medival_jobs_enchanter"
      description: "마법부여 테이블에서 아이템에 인챈트를 부여하며 경험치를 얻습니다."
    farmer:
      display: "농부"
      icon: WHEAT
      custom-icon: "medival_jobs:medival_jobs_farmer"
      description: "다 자란 작물을 수확하며 경험치를 얻습니다."
    fisherman:
      display: "어부"
      icon: FISHING_ROD
      custom-icon: "medival_jobs:medival_jobs_fisherman"
      description: "낚시에 성공할 때마다 경험치를 얻습니다."
    hunter:
      display: "사냥꾼"
      icon: BOW
      custom-icon: "medival_jobs:medival_jobs_hunter"
      description: "적대적인 몬스터를 처치하며 경험치를 얻습니다."
    miner:
      display: "광부"
      icon: IRON_PICKAXE
      custom-icon: "medival_jobs:medival_jobs_miner"
      description: "광석 블록을 채굴하며 경험치를 얻습니다."
    wood_cutter:
      display: "목수"
      icon: OAK_LOG
      custom-icon: "medival_jobs:medival_jobs_wood_cutter"
      description: "나무를 베어 원목을 얻으며 경험치를 얻습니다."
  # 모든 직업이 공유하는 4개의 패시브 스킬 (액티브 스킬 없음).
  skills:
    xp_bonus:
      display: "숙련 경험치"
      max-points: 10
      effect: XP_BONUS_PERCENT
      per-point: 2.0
    extra_yield:
      display: "생산 마스터리"
      max-points: 10
      effect: EXTRA_YIELD_CHANCE_PERCENT
      per-point: 2.0
    critical_xp:
      display: "결정적 성과"
      max-points: 10
      effect: CRITICAL_XP_CHANCE_PERCENT
      per-point: 1.5
    bonus_currency:
      display: "부수입"
      max-points: 10
      effect: BONUS_CURRENCY_CHANCE_PERCENT
      per-point: 2.0

# ItemsAdder가 설치되어 있을 때만 활성화됨 (없으면 이 섹션은 무시됩니다).
# 바닐라 작물과 달리 성장 시간이 10분으로 고정되지 않고 단계(stage)마다
# 개별로 설정합니다 - 각 단계는 서로 다른 커스텀 블록 ID로 표현됩니다.
custom-farming:
  # 수확 1회당 지급되는 온(일반 등급 기준값 — 은별/금별은 아래 quality 배율만큼 더 받음).
  # 커스텀 작물은 행동 속도가 아니라 성장 시간(stages의 minutes)이 수확 빈도를 결정하므로,
  # 아래 crops를 실제로 채우고 나면 작물별 성장 시간에 맞춰 이 값을 다시 조정하세요.
  income-per-harvest: 30
  # 수확 시 굴리는 품질 등급 — 금별을 먼저 굴리고(못 뜨면) 은별을 굴립니다. 나머지는 일반.
  quality:
    gold-chance-percent: 3
    silver-chance-percent: 15
    gold-multiplier: 3.0
    silver-multiplier: 1.5
  crops:
    # 예시 (실제 ItemsAdder에서 만든 네임스페이스ID로 교체하세요):
    # golden_wheat:
    #   xp-reward: 15
    #   stages:
    #     - id: "yeowool:golden_wheat_stage1"
    #       minutes: 5
    #     - id: "yeowool:golden_wheat_stage2"
    #       minutes: 10
    #     - id: "yeowool:golden_wheat_final"
    #       minutes: 0   # 마지막 단계는 minutes를 쓰지 않음 (더 이상 성장 없음)
