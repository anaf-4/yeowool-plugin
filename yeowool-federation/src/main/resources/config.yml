# YeowoolFederation 설정

chat:
  # 연합 채팅(/연합채팅, 연합 채팅 모드) 도배 방지 — 한 번 보낸 뒤 다음 메시지까지 기다려야 하는 시간(밀리초)
  cooldown-ms: 1500

level-up:
  # 현재 레벨 N → N+1 : 누적 활동량이 activity-per-level × N 이상이고,
  # 연합 은행에서 cost-per-level × N 온을 차감합니다. (활동량은 차감되지 않고 계속 쌓임)
  activity-per-level: 20000
  cost-per-level: 30000

member-cap:
  # 연합에 속할 수 있는 마을(토지) 수 = base + per-level × (레벨 - 1)  (연합장 토지 포함)
  base: 3
  per-level: 1

# 연합 전용 상점 — /상점생성 으로 만든 상점의 ID를 적으면, 그 레벨 이상 연합의 연합원만 열 수 있습니다.
# 연합원은 /연합 상점 으로 목록을 열고, 결제는 일반 상점처럼 개인 지갑(온)으로 합니다. 예:
#   - shop-id: federation_basic
#     name: "연합 기본 상점"
#     min-level: 1
shops: []

event:
  # 연합대항 1~3등 보상 (각 연합 은행으로 지급, 온). 기간 동안 활동량을 못 쌓은 연합은 순위에서 제외됩니다.
  rewards: [100000, 50000, 30000]
  auto:
    # 매주 자동 시작 (서버 시간 기준). false 면 관리진이 /연합대항 시작 <분> 으로만 시작합니다.
    # 세 서버 설정을 모두 똑같이 맞추세요 (한 서버라도 켜져 있으면 자동 시작됨).
    enabled: true
    day-of-week: SATURDAY
    start-time: "20:00"
    duration-minutes: 1440
