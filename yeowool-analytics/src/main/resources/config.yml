# 시즌 랭킹 보상 (/시즌랭킹). season.score는 YeowoolLand의 토지 XP 획득량
# (농사/채굴/낚시/사냥/번식 등 실제 활동에서 나오는 XP)을 그대로 누적한
# 값이라, 실제 게임 데이터(온/토지 레벨 등)를 건드리지 않고도 "이번 시즌
# 동안 얼마나 활발히 플레이했는지"를 리셋 가능한 지표로 잴 수 있음.
season:
  period-days: 7
  broadcast: true
  # 순위 -> 보상(온). 여기 없는 순위는 보상 없음
  reward-tiers:
    1: 100000
    2: 50000
    3: 30000
