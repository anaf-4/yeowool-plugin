name: YeowoolTeleport
version: '${version}'
main: com.yeowool.teleport.YeowoolTeleport
api-version: '1.21'
author: Yeowool
description: 순간이동 (홈/워프/tpa)
depend: [YeowoolCore]
softdepend: [ItemsAdder]

commands:
  홈:
    description: 개인 홈 이동/설정/삭제/목록
  워프:
    description: 서버 워프 이동/목록 (설정·삭제는 별도 권한)
  플레이어워프:
    description: 다른 플레이어가 만든 공개 워프를 둘러보거나, 내 워프를 만들고 관리합니다
  tpa:
    description: 다른 플레이어에게 순간이동 요청을 보냅니다
  tpahere:
    description: 다른 플레이어를 내 위치로 부르는 요청을 보냅니다
  tpaccept:
    description: 받은 순간이동 요청을 수락합니다
  tpdeny:
    description: 받은 순간이동 요청을 거절합니다
  rtp:
    description: 무작위 위치로 순간이동합니다

permissions:
  yeowool.teleport.warp.manage:
    description: 워프를 생성/삭제할 수 있는 권한
    default: op
