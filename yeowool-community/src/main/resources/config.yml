# velocity.toml [servers]에 등록된 이 서버의 식별자 - 똑같이 맞춰야 함(lobby/town/wild).
# 아래의 사람이 보는 표시용 "server-name"과는 다른 용도 - 크로스서버 전체 채팅에서
# 프록시가 "어느 서버에서 온 메시지인지" 판단해서 같은 서버 플레이어에게 중복으로
# 다시 안 보내는 데 씀.
proxy-server-id: lobby

# /출석체크 - 일일(연속 출석 시 <N>일째마다 추가 보너스)/주간/월간 3단.
# GUI 배경과 아이콘은 "Rewards UI by MCMobs" ItemsAdder 애드온
# (namespace: rewards, 아이템: rewards_daily/dailye/weekly/weeklye/
# monthly/monthlye)을 그대로 사용함 - 그 애드온의 contents/rewards
# 폴더를 서버 ItemsAdder에 넣고 /iazip 해야 실제로 보임. 없으면 자동으로
# 기본 종이 아이템 + 평범한 GUI 제목으로 대체됨.
attendance:
  reward-on: 1000
  streak-bonus:
    7: 5000
    30: 20000
  weekly:
    cooldown-hours: 168
    reward-on: 5000
  monthly:
    cooldown-hours: 720
    reward-on: 20000
  gui:
    # rewards_blue / rewards_brown / rewards_green / rewards_purple / rewards_red 중 선택
    background: rewards_blue

# /퀘스트 (일일/주간, 왼쪽·오른쪽 버튼으로 구분). stat-key 기준 "이번 기간
# 동안의 증가량"을 재는 방식이라 새 이벤트 리스너가 필요 없음 - YeowoolLife
# 등이 이미 쌓고 있는 통계 키와 정확히 일치해야 함. 일일은 서버 로컬 날짜가
# 바뀌면, 주간은 ISO 주차가 바뀌면 자동으로 다시 뽑힘.
quest:
  # /퀘스트 GUI 배경(daily_quest:*_bg, DailyQuest-1.8.3 팩 기반)의 세로 위치 보정값 — 인게임에서 보면서 조정하세요.
  gui-background-offset: -8

  # 총 완료 퀘스트 수(일일+주간 합산) 기준 뱃지 단계 — 오름차순이어야 함.
  # 아이콘은 DailyQuest-1.8.3 팩의 daily_quest 네임스페이스 것을 그대로 사용.
  badges:
    - name: "Rookie"
      threshold: 0
      icon: "daily_quest:rookie_badge"
    - name: "Beginner"
      threshold: 10
      icon: "daily_quest:beginner_badge"
    - name: "Skilled"
      threshold: 25
      icon: "daily_quest:skilled_badge"
    - name: "Pro"
      threshold: 50
      icon: "daily_quest:pro_badge"
    - name: "Advanced"
      threshold: 100
      icon: "daily_quest:advanced_badge"
    - name: "Expert"
      threshold: 150
      icon: "daily_quest:expert_badge"
    - name: "Master"
      threshold: 200
      icon: "daily_quest:master_badge"
    - name: "Legend"
      threshold: 300
      icon: "daily_quest:legend_badge"

