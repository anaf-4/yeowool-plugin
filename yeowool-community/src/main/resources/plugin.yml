name: YeowoolCommunity
version: '${version}'
main: com.yeowool.community.YeowoolCommunity
api-version: '1.21'
author: Yeowool
description: 커뮤니티 (채팅, 프로필, 칭호/업적, 이벤트, 코스메틱)
depend: [YeowoolCore]
softdepend: [PlaceholderAPI, ItemsAdder]

commands:
  프로필:
    description: 플레이어 프로필을 확인합니다
  내정보:
    description: 내 정보(칭호/온/은행/캐시/토지 레벨/플레이타임)를 확인합니다
  칭호:
    description: 칭호 목록/장착/지급/회수 명령어
  칭호생성:
    description: 새로운 관리자 전용 칭호를 생성합니다
    permission: yeowool.community.title.manage
    default: op
  칭호삭제:
    description: /칭호생성으로 만든 칭호를 삭제합니다
    permission: yeowool.community.title.manage
    default: op
  칭호북:
    description: 칭호 생성/제거 및 GUI로 칭호 지급(생성|제거|목록)
    permission: yeowool.community.title.manage
    default: op
  이벤트:
    description: 서버 이벤트 시작/종료/정보/보상
  코스메틱:
    description: 코스메틱 상점을 엽니다
  친구:
    description: 친구 추가/수락/거절/삭제/목록
  커플:
    description: 커플 신청/수락/거절/해제/정보
  커플채팅:
    description: 내 커플 상대에게만 보이는 메시지를 보냅니다
  일일퀘스트:
    description: 일일 퀘스트를 확인합니다
  주간퀘스트:
    description: 주간 퀘스트를 확인합니다
  출석체크:
    description: 오늘의 출석 보상을 받습니다
  출석보상설정:
    description: 출석 보상(금액/화폐/아이템)을 직접 수정합니다
    permission: yeowool.community.attendance.manage
    default: op
  출석보상초기화:
    description: 일일/주간/월간 출석 보상을 기본값(온 + 자동줍기권/자동심기권)으로 채웁니다 (1회성)
    permission: yeowool.community.attendance.manage
    default: op
  채널:
    description: 채팅 채널 전환 (전체/지역/마을)
  전체:
    description: 전체채팅으로 메시지 한 번을 보냅니다
  지역:
    description: 지역채팅으로 메시지 한 번을 보냅니다 (근처 플레이어만)
  마을:
    description: 마을(토지)채팅으로 메시지 한 번을 보냅니다 (같은 토지 멤버만)
  귓속말:
    aliases: [w, msg, tell]
    description: 다른 플레이어에게 귓속말을 보냅니다
  답장:
    description: 마지막으로 받은 귓속말에 답장합니다
  랭크아이콘:
    description: 랭크 아이콘 목록/부여/제거
  한글닉네임설정권:
    description: 한글 닉네임 설정권을 지급합니다
    permission: yeowool.community.nickname.grant
    default: op
  배틀패스:
    description: 배틀패스를 확인합니다 (관리자는 보상설정/프리미엄지급 하위 명령어 사용 가능)
  메뉴:
    description: 통합 메뉴를 엽니다 (웅크린 채로 손 바꾸기 키를 눌러도 열림)

permissions:
  yeowool.event.manage:
    description: 이벤트를 시작/종료할 수 있는 권한
    default: op
  yeowool.community.rankicon.manage:
    description: 랭크 아이콘을 부여/제거할 수 있는 권한
    default: op
  yeowool.community.title.manage:
    description: 통계 자동 해금이 없는 칭호를 지급/회수할 수 있는 권한
    default: op
  yeowool.community.nickname.grant:
    description: 한글 닉네임 설정권을 지급할 수 있는 권한
    default: op
  yeowool.community.attendance.manage:
    description: 출석 보상(금액/화폐/아이템)을 직접 수정할 수 있는 권한
    default: op
  yeowool.community.battlepass.manage:
    description: 배틀패스 보상을 직접 수정하거나 프리미엄을 무상 지급할 수 있는 권한
    default: op
