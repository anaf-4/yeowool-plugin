# YeowoolCore 공통 메시지
# MiniMessage 형식을 사용합니다. (예: <green>, <red>, <gray> 등)

prefix: "<gray>[<green>여울</green>]</gray> "

general:
  no-permission: "<red>권한이 없습니다.</red>"
  player-only: "<red>플레이어만 사용할 수 있는 명령어입니다.</red>"
  reload-success: "<green>설정을 다시 불러왔습니다.</green>"
  data-loading: "<yellow>데이터를 불러오는 중입니다. 잠시 후 다시 시도해주세요.</yellow>"
  unknown-error: "<red>알 수 없는 오류가 발생했습니다. 관리자에게 문의해주세요.</red>"

economy:
  balance-too-low: "<red>온이 부족합니다.</red>"

mailbox:
  delivered-on-join: "<green>우편함에 있던 아이템 <count>개를 인벤토리로 받았습니다.</green>"
  pending-notice: "<yellow>우편함에 아직 받지 못한 아이템이 <count>개 있습니다. /우편함 으로 확인하세요.</yellow>"
  already-claimed: "<red>이미 수령했거나 존재하지 않는 항목입니다.</red>"
  claim-success: "<green>아이템을 수령했습니다.</green>"

payout:
  received: "<green><reason>: <amount>온을 받았습니다.</green>"

stardust:
  received: "<light_purple>✦ 별조각 +<amount></light_purple> <gray>(<reason>)</gray>"
  balance: "<light_purple>✦ 내 별조각: <amount>개</light_purple> <gray>(교환소 NPC에서 사용)</gray>"
  balance-other: "<light_purple><player>님의 별조각: <amount>개</light_purple>"
  granted: "<green><player>님에게 별조각 <amount>개를 지급했습니다.</green>"
  taken: "<green><player>님의 별조각 <amount>개를 회수했습니다.</green>"
  insufficient: "<red><player>님의 별조각이 <amount>개보다 적습니다.</red>"
  unknown-player: "<red>한 번도 접속한 적 없는 플레이어입니다.</red>"
  usage: "<gray>/별조각 | /별조각 확인 [닉네임] | /별조각 지급 [닉네임] [개수] | /별조각 회수 [닉네임] [개수]</gray>"
  error: "<red>처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.</red>"
