# YeowoolCore 공통 메시지
# MiniMessage 형식을 사용합니다. (예: <green>, <red>, <gray> 등)

prefix: "<gray>[<green>여울</green>]</gray> "

general:
  no-permission: "<red>권한이 없습니다.</red>"
  player-only: "<red>플레이어만 사용할 수 있는 명령어입니다.</red>"
  reload-success: "<green>설정을 다시 불러왔습니다.</green>"
  data-loading: "<yellow>데이터를 불러오는 중입니다. 잠시 후 다시 시도해주세요.</yellow>"
  unknown-error: "<red>알 수 없는 오류가 발생했습니다. 관리자에게 문의해주세요.</red>"

economy:
  balance-too-low: "<red>온이 부족합니다.</red>"

mailbox:
  delivered-on-join: "<green>우편함에 있던 아이템 <count>개를 인벤토리로 받았습니다.</green>"
  pending-notice: "<yellow>우편함에 아직 받지 못한 아이템이 <count>개 있습니다. /우편함 으로 확인하세요.</yellow>"
  already-claimed: "<red>이미 수령했거나 존재하지 않는 항목입니다.</red>"
  claim-success: "<green>아이템을 수령했습니다.</green>"
