# /길라잡이 GUI 아이콘 — 명령어 목록은 위 help.categories의 같은 이름 카테고리를 그대로 씁니다.
# GUI 칸 제한으로 최대 9개까지만 표시됩니다.
guide:
  categories:
    경제:
      icon: GOLD_INGOT
      description: "온(기본 화폐)과 은행, 캐시(유료 화폐)를 관리합니다."
    토지:
      icon: GRASS_BLOCK
      description: "내 땅을 만들고, 멤버를 초대하고, 그리핑으로부터 보호합니다."
    마을연합:
      icon: WHITE_BANNER
      description: "마을 연합을 만들고, 다른 마을 소유주들과 함께 협력합니다."
    생활:
      icon: WHEAT
      description: "농사·벌목·목축·낚시·채광으로 자원을 모읍니다."
    직업:
      icon: DIAMOND_PICKAXE
      description: "직업을 선택해 특화 스킬과 보너스를 얻습니다."
    상점·거래:
      icon: EMERALD
      description: "NPC 상점에서 사고 팔거나, 다른 플레이어와 거래·경매를 합니다."
    순간이동:
      icon: ENDER_PEARL
      description: "홈, 워프, 플레이어 순간이동 요청으로 빠르게 이동합니다."
    채팅:
      icon: WRITABLE_BOOK
      description: "전체/지역/마을 채팅 채널과 귓속말을 사용합니다."
    커뮤니티:
      icon: PLAYER_HEAD
      description: "칭호, 친구, 파티, 커플 등 다른 플레이어와 어울리는 기능입니다."
