# YeowoolCore 설정
# /여울코어 reload 로 다시 불러올 수 있습니다.

database:
  host: localhost
  port: 3306
  database: yeowool
  username: root
  password: "changeme"
  pool-size: 10
  connection-timeout-ms: 30000

cache:
  player-cache-expire-minutes: 30
  player-cache-max-size: 500

# /우편함 — GUI 배경(yeowool_mailbox:mailbox_bg, DailyRewards-0.2.3 팩 기반)의 좌우 위치 보정값.
mailbox:
  gui-background-offset: -8

# 자동 저장 주기 (틱, 20틱 = 1초). 기본값 5분.
autosave-interval-ticks: 6000

debug: false

sounds:
  success:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.2
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  click:
    sound: UI_BUTTON_CLICK
    volume: 0.6
    pitch: 1.0
  levelup:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
