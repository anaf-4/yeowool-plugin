# YeowoolCore 설정
# /여울코어 reload 로 다시 불러올 수 있습니다.

database:
  host: localhost
  port: 3306
  database: yeowool
  username: root
  password: "changeme"
  pool-size: 10
  connection-timeout-ms: 30000

cache:
  player-cache-expire-minutes: 30
  player-cache-max-size: 500

# /우편함 — GUI 배경(yeowool_mailbox:mailbox_bg, DailyRewards-0.2.3 팩 기반)의 좌우 위치 보정값.
mailbox:
  gui-background-offset: -8

# 자동 저장 주기 (틱, 20틱 = 1초). 기본값 5분.
autosave-interval-ticks: 6000

debug: false

sounds:
  success:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.2
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  click:
    sound: UI_BUTTON_CLICK
    volume: 0.6
    pitch: 1.0
  levelup:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0

# /여울도움말 [카테고리] — 다른 플러그인이 늘어날 때마다 여기에 추가하세요.
help:
  # 이 카테고리들은 /여울도움말의 기본 목록에서 빠지고, OP가 아니면 직접 열어봐도 거부됩니다.
  # (help.categories 자체에는 그대로 남아있어야 HelpIndexChecker가 이 안에 언급된
  # 관리자 명령어들도 "문서화됨"으로 계속 인식합니다.)
  admin-only-categories:
    - "운영(관리자)"
  categories:
    경제:
      - "/돈 - 지갑 잔액 확인"
      - "/돈 보내기 <닉네임> <금액> - 다른 플레이어에게 송금 (오프라인도 가능)"
      - "/은행 - 개인 은행 잔액 확인"
      - "/은행 입금|출금 <금액>"
      - "/내캐시 - 보유한 캐시(유료 재화) 확인"
    토지:
      - "/토지 - 내 토지 정보"
      - "/토지 확인 - 보유 청크 경계 표시"
      - "/토지 멤버 - 멤버 목록"
      - "/토지 초대|추방 <닉네임>"
      - "/토지 권한 <닉네임> <건축|상자> <켜기|끄기> - 멤버 세부 권한"
      - "/토지 은행 입금|출금 <금액>"
      - "/토지 업그레이드"
      - "/토지 삭제 - 본인 소유 토지 해체"
      - "/토지 설정 pvp"
      - "/마을랭킹 - 토지 레벨 기준 마을 랭킹 TOP 10"
    상점·거래:
      - "/상점 [상점ID] - NPC 상점"
      - "/거래소 등록|내판매|취소 - 플레이어 상점"
      - "/거래 <닉네임> - 직접 거래 요청, /거래 수락"
      - "/경매 - 경매장 둘러보기, /경매 등록 <시작가> <즉시구매가|0> <시간(분)>, /경매 검색 <키워드>"
    생활:
      - "/도감 - 낚시 도감"
      - "/낚시대회 - 진행 중인 낚시 대회 현황"
      - "농사/벌목/목축/낚시/채광은 전부 자동으로 경험치 획득"
    직업:
      - "/직업 - 현재 직업 정보"
      - "/직업 선택 <목수|농부|어부|요리사|연금술사>"
      - "/직업 목록 - 전체 직업별 보유 레벨"
      - "/직업 스킬 - 스킬 포인트 배분 GUI"
    순간이동:
      - "/홈 [이름] - 등록한 홈으로 이동 (이름 생략 시 기본 홈)"
      - "/홈 설정|삭제|목록 [이름]"
      - "/워프 [이름] - 서버 워프로 이동, 이름 생략 시 목록"
      - "/tpa <닉네임> - 상대에게 이동 요청, /tpahere - 상대를 내게 부름"
      - "/tpaccept, /tpdeny - 요청 수락/거절"
    채팅:
      - "/채널 전체|지역|마을 - 기본 채팅 채널 전환"
      - "/전체, /지역, /마을 <메시지> - 채널 안 바꾸고 한 번만 전송"
      - "/귓속말 <닉네임> <메시지> (또는 /w, /msg, /tell), /답장 <메시지>"
    커뮤니티:
      - "/길라잡이 - 신규 플레이어용 서버 시스템 안내 GUI (첫 접속 시 자동으로 한 번 열림)"
      - "/프로필 [닉네임]"
      - "/내정보 - 내 정보(칭호/온/은행/캐시/토지 레벨/플레이타임) 확인"
      - "/칭호 목록|장착 [id]|해제"
      - "/랭크아이콘 목록"
      - "/코스메틱 - 파티클/채팅색 상점"
      - "/친구 추가|수락|거절|삭제|목록"
      - "/랭킹 [온|은행|토지레벨|낚시도감]"
      - "/시즌랭킹 - 이번 시즌 랭킹 확인"
      - "/출석체크 - 오늘의 출석 보상 받기"
      - "/퀘스트 - 일일/주간 퀘스트 확인"
      - "/이벤트 정보, /이벤트 보상받기 - 진행 중인 이벤트 확인/참가"
    쿠폰:
      - "/쿠폰 - 쿠폰 이름을 입력할 모루를 엽니다"
    신고·우편함:
      - "/신고 <닉네임> <사유>"
      - "/우편함 - 못 받은 아이템 확인/수령"
    운영(관리자):
      - "/yeowoolcore reload - 설정 리로드 (별칭: /여울코어, /ywcore)"
      - "/여울관리 정보|지급|공지|백업|복구|기본템|로그|우편"
      - "/경고 지급|회수|기록 <닉네임> ... - 누적 경고 10회(설정 가능) 이상 시 자동 정지"
      - "/캐시지급 <닉네임> <금액> - 캐시 지급/차감 (음수 입력 시 차감)"
      - "/추방, /정지, /정지해제, /음소거, /음소거해제, /제재기록"
      - "/귀속, /기간제, /아이템이름, /아이템설명, /아이템, /아이템내구도"
      - "/관리자아이템, /쿠폰생성, /쿠폰관리"
      - "/이벤트 시작|종료|미션시작|미션종료 (yeowool.event.manage)"
      - "/토지 관리 목록|삭제|이전 (yeowool.land.bypass)"
      - "/칭호 지급|회수 <닉네임> <id> (yeowool.community.title.manage)"
      - "/랭크아이콘 부여|제거 <닉네임> [아이콘id] (yeowool.community.rankicon.manage)"
      - "/워프 설정|삭제 (yeowool.teleport.warp.manage)"
      - "/상점생성, /상점제거, /상점수정, /상점아이템설정, /상점페이지추가, /상점페이지제거, /상점로테이션설정, /상점로테이션추가, /상점로테이션제거, /상점가져오기 (yeowool.market.shop.manage)"
      - "/칭호생성, /칭호삭제, /칭호북 생성|제거|목록 (yeowool.community.title.manage)"
      - "/수표 <금액> - 온 수표 아이템 생성, /유료수표 <금액> - 캐시 수표 아이템 생성"
      - "/한글닉네임설정권 <닉네임> - 한글 닉네임 설정권 지급 (yeowool.community.nickname.grant)"
      - "/여울통계 - 서버 통계 리포트 출력 (yeowool.analytics.view)"
      - "/출석보상설정 - 출석 보상(금액/화폐/아이템) 직접 수정"
      - "/길라잡이 추가|제거|수정|목록 (yeowool.core.guide.manage)"

# /길라잡이 — 신규 플레이어용 GUI 안내 (첫 접속 시 자동으로 한 번 열림).
# /여울도움말과 달리 명령어 문법이 아니라 "이 시스템이 뭘 하는지"를 쉽게 설명하는 용도라
# 카테고리별로 아이콘/한 줄 설명만 여기서 관리하고, 관련 명령어 목록은 위 help.categories의
# 같은 이름 카테고리를 그대로 재사용합니다(둘이 따로 놀지 않도록).
guide:
  categories:
    경제:
      icon: GOLD_INGOT
      description: "온(기본 화폐)과 은행, 캐시(유료 화폐)를 관리합니다."
    토지:
      icon: GRASS_BLOCK
      description: "내 땅을 만들고, 멤버를 초대하고, 그리핑으로부터 보호합니다."
    생활:
      icon: WHEAT
      description: "농사·벌목·목축·낚시·채광으로 자원을 모읍니다."
    직업:
      icon: DIAMOND_PICKAXE
      description: "직업을 선택해 특화 스킬과 보너스를 얻습니다."
    상점·거래:
      icon: EMERALD
      description: "NPC 상점에서 사고 팔거나, 다른 플레이어와 거래·경매를 합니다."
    순간이동:
      icon: ENDER_PEARL
      description: "홈, 워프, 플레이어 순간이동 요청으로 빠르게 이동합니다."
    채팅:
      icon: WRITABLE_BOOK
      description: "전체/지역/마을 채팅 채널과 귓속말을 사용합니다."
    커뮤니티:
      icon: PLAYER_HEAD
      description: "칭호, 친구, 코스메틱, 이벤트 등 다른 플레이어와 어울리는 기능입니다."
